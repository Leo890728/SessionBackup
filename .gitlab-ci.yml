# Auto-build the .vsix on every push / MR, and attach it to a GitLab Release on v* tags.
#
# Runs on a dedicated Docker-executor runner (tag `session-backup`) on the Hyper-V VM
# 10.0.10.104 (host 10.0.10.103). Register it against http://10.0.10.31 and set
#   clone_url = "http://10.0.10.31"
# in config.toml so jobs clone straight from GitLab instead of the gitlab.synct.com.tw
# proxy (which rejects the CI job token). The runner needs outbound internet
# (Docker Hub, npmjs.org, registry.gitlab.com). Do NOT reuse the air-gapped
# `security-offline` runner from secure_CI_pipeline.
#
# Node 22: the test script uses `node --test "out/**/*.test.js"`, whose glob support
# needs Node >= 22.

stages:
  - test
  - package
  - release

default:
  image: node:22
  tags:
    - session-backup
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  script:
    - npm ci
    - npm test

package:
  stage: package
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PKG_VERSION="$(node -p "require('./package.json').version")"
        echo "package.json = $PKG_VERSION / tag = ${CI_COMMIT_TAG#v}"
        if [ "v$PKG_VERSION" != "$CI_COMMIT_TAG" ]; then
          echo "Tag $CI_COMMIT_TAG does not match package.json version $PKG_VERSION"
          exit 1
        fi
      fi
    - npm ci
    - VSIX="session-backup-${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}.${CI_COMMIT_SHORT_SHA}.vsix"
    - npm run package -- --out "$VSIX"
    - cp "$VSIX" session-backup.vsix   # stable name for the release asset link
    - echo "built $VSIX"
  artifacts:
    name: "vsix-$CI_COMMIT_REF_SLUG"
    paths:
      - "*.vsix"
    expire_in: 30 days

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: package
      artifacts: true
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "session-backup-$CI_COMMIT_TAG.$CI_COMMIT_SHORT_SHA.vsix"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/session-backup.vsix?job=package"
