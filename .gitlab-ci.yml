# Auto-build the .vsix on every push / MR, and attach it to a GitLab Release on v* tags.
#
# Runs on a dedicated Docker-executor runner registered against this project on the
# self-managed GitLab (10.0.10.31), living on the 10.0.10.103 Hyper-V VM's Docker Engine.
# Register that runner with:
#   - tag `session-backup` (jobs below are pinned to it via `default: tags`)
#   - executor: docker, and outbound internet allowed (needs Docker Hub, npmjs.org, gitlab.com)
#   - do NOT reuse the air-gapped `security-offline` runner from secure_CI_pipeline.

stages:
  - test
  - package
  - release

default:
  image: node:20
  tags:
    - session-backup
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  script:
    - npm ci
    - npm test

package:
  stage: package
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PKG_VERSION="$(node -p "require('./package.json').version")"
        echo "package.json = $PKG_VERSION / tag = ${CI_COMMIT_TAG#v}"
        if [ "v$PKG_VERSION" != "$CI_COMMIT_TAG" ]; then
          echo "Tag $CI_COMMIT_TAG does not match package.json version $PKG_VERSION"
          exit 1
        fi
      fi
    - npm ci
    - npm run package
    - cp session-backup-*.vsix session-backup.vsix   # stable name for the release asset link
  artifacts:
    name: "vsix-$CI_COMMIT_REF_SLUG"
    paths:
      - session-backup-*.vsix
    expire_in: 30 days

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: package
      artifacts: true
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "session-backup-$CI_COMMIT_TAG.vsix"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/session-backup.vsix?job=package"
